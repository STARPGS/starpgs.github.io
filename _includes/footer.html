<footer id="footer">
    <!--Footer Button-->
    <div class="container has-text-centered has-background-grey-darker" id="backtotop">
        <a class="has-text-white" onclick="window.scroll(0,0)">BACK TO TOP</a>
    </div>
    <!--Footer Main Section-->
    <div class="has-background-grey-darker">
        <div class="container columns">

            <!--Link Section-->
            <div class="column has-text-white">
                <h3>More Links</h3>
		<li>
                    <a href="{{ '/blog' | absolute_url }}">Blog</a>
                </li>
                <li>
                    <a target="_blank" href="{{site.url}}{{site.baseurl}}/feed.xml">Subscribe via RSS</a>
                </li>
            </div>

            <!--Blog-post Section-->
            <div class="column has-text-white">
                <h3>Recent Posts</h3>
                {% for post in site.posts offset: 0 limit:3 %}
                <li>
                    <a href="{{post.url | absolute_url}}">{{post.title}}</a>
                </li>
                {% endfor %}
            </div>

	    <!--Donation Section-->
 	    <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
	    <div id="paypal-donate-button-container"></div>
	    <script>
  	    PayPal.Donation.Button({
      		 env: 'production',
      		 hosted_button_id: 'TL2VS53GD5KU2',
      		 image: {
                      src: 'https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif',
                      title: 'PayPal - The safer, easier way to pay online!',
                      alt: 'Donate with PayPal button'
      	        },
       		onComplete: function (params) {
    		},
  	    }).render('#paypal-donate-button-container');
	    </script>

        </div>
    </div>
    <div class="has-background-black has-text-centered has-text-white" id="credits">
        <i class="far fa-copyright"></i> © {{ "now" | date: "%Y" }} STARPGS LLC | <a href="{{ '/tdm-policy' | absolute_url }}">AI Policy</a>
    </div>
</footer>
