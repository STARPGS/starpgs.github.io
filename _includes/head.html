<head>
    {% include meta.html %}
    <title>{{site.title}}</title>
    <link rel="stylesheet" href="{% if site.baseurl %}{{site.baseurl}}{% else %}{% endif %}/assets/css/style.css">
    <link rel="shortcut icon" href="{% if site.favicon-url %}{{site.favicon-url}}{% else %}{{ 'assets/images/logo.png' | absolute_url }}{% endif %}" type="image/x-icon">

<script type="module" src="{{ '/assets/js/turbo.js' | relative_url }}"></script>
<!-- Global Config for turbo to pass vars to js -->
    <script>
      window.siteConfig = {
        url: "{{ site.url }}",
        baseurl: "{{ site.baseurl }}"
      };
    </script>
    

<script>
(() => {
  const root = document.documentElement;
  const FPS_LIMIT = 40;
  const SLOW_SAMPLES_REQUIRED = 2;
  const SAMPLE_MS = 500;

  const cores = navigator.hardwareConcurrency ?? null;
  const ramGiB = navigator.deviceMemory ?? null;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  const diagnostics = {
    cores,
    ramGiB,
    isMobile,
    measuredFps: null,
    longTasks: 0,
    lowSpecsReason: null
  };

  window.deviceCheck = diagnostics;

  function markLowSpecs(reason) {
    diagnostics.lowSpecsReason ??= reason;

    if (!root.classList.contains('low-specs')) {
      root.classList.add('low-specs');
      console.log(`LOW SPECS TRIGGERED: ${reason}`);
    }
  }

  /* Use reported hardware as an initial hint */
  if (isMobile && cores !== null && cores <= 4) {
    markLowSpecs('mobile hardware hint');
  } else if (
    (cores !== null && cores <= 4) ||
    (ramGiB !== null && ramGiB <= 4)
  ) {
    markLowSpecs('hardware hint');
  }

  function startPerformanceWatchdog() {
    /* Long tasks are an extra signal; FPS detection runs independently */
    try {
      const observer = new PerformanceObserver(list => {
        for (const entry of list.getEntries()) {
          diagnostics.longTasks++;

          if (diagnostics.longTasks >= SLOW_SAMPLES_REQUIRED) {
            markLowSpecs('sustained long tasks');
          }
        }
      });

      observer.observe({ entryTypes: ['longtask'] });
    } catch {
      /* Long Task API unavailable */
    }

    let sampleStart = null;
    let frames = 0;
    let slowSamples = 0;

    function checkFrame(now) {
      if (document.hidden) {
        sampleStart = null;
        frames = 0;
      } else if (sampleStart === null) {
        sampleStart = now;
        frames = 0;
      } else {
        frames++;

        const elapsed = now - sampleStart;

        /* Check FPS once per sample window */
        if (elapsed >= SAMPLE_MS) {
          const fps = frames * 1000 / elapsed;
          diagnostics.measuredFps = Math.round(fps);

          if (fps < FPS_LIMIT) {
            slowSamples++;
          } else {
            slowSamples = 0;
          }

          if (slowSamples >= SLOW_SAMPLES_REQUIRED) {
            markLowSpecs('sustained low FPS');
            return;
          }

          sampleStart = now;
          frames = 0;
        }
      }

      requestAnimationFrame(checkFrame);
    }

    requestAnimationFrame(checkFrame);
  }

  /* Start the check even if the load event has already fired */
  if (document.readyState === 'complete') {
    startPerformanceWatchdog();
  } else {
    window.addEventListener('load', startPerformanceWatchdog, { once: true });
  }
})();
</script>




{% if page.typewriter_effect %}
    <style>
        /* This hides the content IMMEDIATELY without waiting for JS to prevent flash. */
        .jrpg-typewriter-container > * { 
            opacity: 0 !important; 
        }
    </style>
    <script>
        /* This runs immediately to hide text and prevent the "flash" of content */
        document.documentElement.classList.add('jrpg-typewriter-js-enabled');
    </script>

{% endif %}

<script src="{{ '/assets/js/typewriter.js' | relative_url }}" defer></script>


<!-- Load jekyll search script in head to prevent turbo issues-->
<script src="{{site.url}}{{site.baseurl}}/assets/js/simple-jekyll-search.js"></script>


<!-- Load paypal script and also run paypal button logic in head to prevent turbo issues-->
<script>
(function () {
  if (window.__paypalDonateHandlerInstalled) return;
  window.__paypalDonateHandlerInstalled = true;

  /* Inject immediately so it is ready by the time turbo:load fires */
  if (!window.PayPal) {
    const script = document.createElement("script");
    script.src = "https://www.paypalobjects.com/donate/sdk/donate-sdk.js";
    script.charset = "UTF-8";
    document.head.appendChild(script);
  }

  document.addEventListener("turbo:load", function () {
    var container = document.getElementById("paypal-donate-button-container");

    if (!container || container.dataset.paypalInitialized) return;
    if (!window.PayPal || !window.PayPal.Donation) return;

    container.dataset.paypalInitialized = "true";

    window.PayPal.Donation.Button({
      env: "production",
      hosted_button_id: "TL2VS53GD5KU2",
      image: {
        src: "https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif",
        title: "PayPal - The safer, easier way to pay online!",
        alt: "Donate with PayPal button"
      }
    }).render("#paypal-donate-button-container");
  });
})();
</script>





<script src="{{ '/assets/js/persistent-background.js' | relative_url }}" defer></script>

<!-- Must run in head but after html loads for turbo to work, so defer-->
<script src="{{ '/assets/js/turbo-runner.js' | relative_url }}" defer></script>

</head>
