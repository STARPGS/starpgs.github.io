<head>
    {% include meta.html %}
    <title>{{site.title}}</title>
    <link rel="stylesheet" href="{% if site.baseurl %}{{site.baseurl}}{% else %}{% endif %}/assets/css/style.css">
    <link rel="shortcut icon" href="{% if site.favicon-url %}{{site.favicon-url}}{% else %}{{ 'assets/images/logo.png' | absolute_url }}{% endif %}" type="image/x-icon">

<script type="module" src="{{ '/assets/js/turbo.js' | relative_url }}"></script>
<!-- Global Config for turbo to pass vars to js -->
    <script>
      window.siteConfig = {
        url: "{{ site.url }}",
        baseurl: "{{ site.baseurl }}"
      };
    </script>
    

    <script>
        /* This hides the high specs content IMMEDIATELY without waiting for JS to prevent flash. */
        (function() {
            const isLowMemory = navigator.deviceMemory && navigator.deviceMemory < 4;
            const isLowCPU = navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4;
            
            if (isLowMemory || isLowCPU) {
                /* We use documentElement because the <body> has not loaded yet */
                document.documentElement.classList.add('low-specs');
            }
        })();
    </script>



{% if page.typewriter_effect %}
    <style>
        /* This hides the content IMMEDIATELY without waiting for JS to prevent flash. */
        .jrpg-typewriter-container > * { 
            opacity: 0 !important; 
        }
    </style>
    <script>
        /* This runs immediately to hide text and prevent the "flash" of content */
        document.documentElement.classList.add('jrpg-typewriter-js-enabled');
    </script>
{% endif %}


<!-- Load paypal script and also run paypal button logic in head to prevent turbo issues-->
<script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>

<script>
(function() {
    /* We define the function here so it can be reused */
    function renderPayPalButton() {
        const container = document.getElementById('paypal-donate-button-container');
        
        /* Only render if the container exists and is empty */
        if (container && container.innerHTML.trim() === "") {
            /* Safety check: make sure the PayPal object is actually loaded */
            if (typeof PayPal !== 'undefined' && PayPal.Donation) {
                try {
                    PayPal.Donation.Button({
                        env: 'production',
                        hosted_button_id: 'TL2VS53GD5KU2',
                        image: {
                            src: 'https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif',
                            title: 'PayPal - The safer, easier way to pay online!',
                            alt: 'Donate with PayPal button'
                        },
                        onComplete: function (params) { },
                    }).render('#paypal-donate-button-container');
                } catch (err) {
                    /* This catches the "Listener already exists" error without crashing the script */
                    console.log("PayPal SDK: Handled render exception.");
                }
            } else {
                /* If the SDK isn't ready yet, try again in 100ms */
                setTimeout(renderPayPalButton, 100);
            }
        }
    }

    /* RUN ON FIRST LOAD */
    document.addEventListener('DOMContentLoaded', renderPayPalButton);

    /* RUN ON TURBO NAVIGATIONS */
    document.addEventListener('turbo:load', renderPayPalButton);
})();
</script>



<!-- Must run in head but after html loads for turbo to work, so defer-->
<script src="{{ '/assets/js/turbo-runner.js' | relative_url }}" defer></script>

</head>
