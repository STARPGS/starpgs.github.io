<!DOCTYPE html>
<html>
{% include head.html %}

<body>

  <div class="space-system-container">
    <div class="ds-vignette"></div>
    <div class="ds-noise-overlay"></div>

    <div class="ds-nebula-wrapper">
        <div class="ds-nebula-cloud ds-cloud-1"></div>
        <div class="ds-nebula-cloud ds-cloud-2"></div>
        <div class="ds-nebula-cloud ds-cloud-3"></div>
    </div>

    <!-- Far Layer: Scroll Wrapper -> Twinkle Layers -->
    <div class="ds-star-scroll-wrapper ds-far">
        <div class="ds-star-layer ds-stars-far-slow"></div>
        <div class="ds-star-layer ds-stars-far-fast"></div>
    </div>

    <!-- Mid Layer: Scroll Wrapper -> Twinkle Layers -->
    <div class="ds-star-scroll-wrapper ds-mid">
        <div class="ds-star-layer ds-stars-mid-slow"></div>
        <div class="ds-star-layer ds-stars-mid-fast"></div>
    </div>

    <!-- Near Layer: Scroll Wrapper -> Twinkle Layers -->
    <div class="ds-star-scroll-wrapper ds-near">
        <div class="ds-star-layer ds-stars-near-slow"></div>
        <div class="ds-star-layer ds-stars-near-fast"></div>
    </div>
</div>

  {% include navbar.html %}
  {% include showcase.html %}
  {% include about.html %}
  {% include contact.html %}
  <!--Footer begins here-->
  {% include footer.html %}
</body>
<script>
  var navItems = document.getElementsByClassName('navbar-item');
  var heroes = document.getElementsByClassName('hero');
  const viewOffset = 200; 

  window.addEventListener("scroll", function (event) {
    var scroll = this.scrollY;
    var position = window.pageYOffset;

    for (var i = 0; i < navItems.length; i++) {
      navItems[i].classList.remove('is-active');
    }

    for (var i = 0; i < heroes.length; i++) {
        var sectionTop = heroes[i].offsetTop-viewOffset;
        var sectionBottom = heroes[i].offsetTop + heroes[i].offsetHeight-viewOffset;

        if (scroll >= sectionTop && scroll < sectionBottom) {
          navItems[i+1].classList.add('is-active');
      }
    }
  });
</script>

</html>
