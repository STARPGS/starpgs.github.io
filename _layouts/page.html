---
layout: compress
---

<!DOCTYPE html>
<html>
{% include head.html %}

<body>
    {% include ds-background.html %}
    {% include navbar.html %}
<main id="content-area">
    <section class="hero is-fullheight">
        <div class="hero-body">
            <div class="container has-text-centered" id="page-section">
                <div class="section">

		    <div id="title">
                        <h1 class="title is-1 is-uppercase has-text-weight-bold">{{page.title}}</h1>
                        <hr class="has-background-black">
		    </div>

                    {% if page.typewriter_effect %}

                    <!-- This wraps your markdown content in the cobalt retro box automatically -->
                    <div class="container">
                        <div class="box jrpg-typewriter-container content is-marginless {% if page.text_align == 'left' %}align-left{% endif %}" style="margin: 0 auto !important;">
                            {{ content }}
                        </div>
                    </div>


                    {% else %}
                    <!-- Standard layout for normal posts -->
                    <div class="content is-marginless {% if page.text_align == 'left' %}has-text-left{% endif %}" style="margin: 0 auto !important;">
                        {{ content }}
                    </div>
                {% endif %}
                </div>
            </div>
        </div>
    </section>
</main>
{% if page.typewriter_effect %}
<!-- This adds the Skip button only to pages that need it, floating at page's bottom -->
<button id="jrpg-typewriter-skip-button">SHOW ALL</button>
{% endif %}
    <!--Footer begins here-->
    {% include footer.html %}
</body>

</html>
