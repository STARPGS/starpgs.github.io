# WhatATheme
markdown: kramdown

# URL of the Site
url: 'https://starpgs.github.io'
# Base URL of the Site (i.e., Name of the Repository in which the Site is hosted)
baseurl: 

# Title of the Site
title: STARPGS
# Description of the Site
description: Indie video game studio creating meaningful RPG experiences
# URL of Image of the Site
site-image: 
# Keywords of the Site
site-keywords: starpgs, rpg, jrpg, indie, gaming
# URL for the Image of custom Favicon
favicon-url: 

# URL of the Image of Custom Hero Image (i.e., the image in the background of the very first section of the Homepage)
heroimage: 

# Social Media and Contact
# If you don't want to use any icon, you can leave them blank.
email: contact@starpgs.co
facebook_username:
twitter_username:
instagram_username: 
linkedin_username: 
github_username:
youtube_channel_id: https://www.youtube.com/user/starpgs
reddit_username: /starpgs
behance_username: /
dribbble_username: /
spotify_username: /

# Google Analytics
google-analytics:

# Name of the Author
author-name: STARPGS
# URL for the Image of the Author
author-image: 
# 60 Words About the Author
author-about: Striving to create unique, meaningful RPG experiences
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: 

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
